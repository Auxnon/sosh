[package]
name = "sosh_desktop"
version = "0.2.1"
edition = "2024"
description = "sosh for the desktop (Linux, macOS, Windows): the social client in egui on wgpu, styled like the Android app, hosting Petrichor64 for the world"
publish = false

[[bin]]
name = "sosh"
path = "src/main.rs"

[dependencies]
winit = "0.30.13"
egui = { version = "0.37", features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
egui-wgpu = { version = "0.37", default-features = false }
wgpu = { version = "30", default-features = false, features = ["wgsl", "std"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", features = ["json"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = "0.18"
log = "0.4"
# The engine, as a library (its src/instance.rs): the world and shared carts.
# Its own window, console and `chor` binary stay out (no default features).
petrichor64 = { package = "Petrichor64", git = "https://github.com/Auxnon/Petrichor64", rev = "efb59f2979c97c08815ed4e7ff5a8eb34c1e55aa", default-features = false, features = ["headed", "silt", "audio", "studio", "ws"] }
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "gles"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12", "gles"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

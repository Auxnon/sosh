# The server image (Containerfile), built here so the server only pulls it:
# ghcr.io/<owner>/sosh, for x86_64 and arm64 (each on its own native runner,
# no emulation), tagged `latest` and `sha-<commit>` from main and the version
# from a v* tag. The NixOS deploy pulls it (deploy/README.md, deploy/AGENT.md).
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NAME: sosh

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: names
        run: |
          # registry names are lowercase; the owner (Auxnon) isn't
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}" >> "$GITHUB_ENV"
          p='${{ matrix.platform }}'; echo "PAIR=${p//\//-}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # pushed by digest only; the merge job puts the tags on both
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PAIR }}
          cache-to: type=gha,scope=${{ env.PAIR }},mode=max

      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          d='${{ steps.build.outputs.digest }}'; touch "$RUNNER_TEMP/digests/${d#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PAIR }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tag both platforms as one image
        working-directory: ${{ runner.temp }}/digests
        # word splitting wanted: one -t per tag, one argument per digest
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$(jq -r '.tags[0] | split(":")[1]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"

# The client, for a v* tag, all pointed at https://sosh.makeavoy.com and
# attached to a GitHub release:
# - the desktop app (desktop/: chat, servers and the world, hosting
#   Petrichor64 as a library): a Linux AppImage, a Windows exe, a macOS dmg
#   (sosh-<version>-...)
# - the world alone (the Petrichor64 engine with the game baked in), the same
#   three (sosh-world-<version>-...)
# - the Android APK
# - the server: the container image (Containerfile), for x86_64 and arm64,
#   pushed to ghcr.io/<owner>/sosh (a v* tag, say v1.2.0, publishes 1.2.0,
#   1.2, 1 and latest; a pre-release, v1.3.0-rc1, only its own tag, never
#   latest), and the same images as files on the release
#   (sosh-server-amd64.tar.gz, -arm64), for `sosh-deploy release` when the
#   registry can't be reached (deploy/README.md)
# Run it by hand (workflow_dispatch) to get the files as workflow artifacts
# without a release; nothing is pushed then.
#
# Android signing secrets (optional, but without them every release is signed
# with a throwaway debug key and won't install over the last one):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD      (if it differs from the keystore's)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  NAME: sosh
  # The engine the client is known to work with; keep in step with the
  # Containerfile's P64_REF. (It takes silt-lua from silt-lua's GitHub main.)
  P64_REPO: Auxnon/Petrichor64
  P64_REF: db2792e6ca73b92f8a0d6e1990916bf9a6809201
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"

  # The game, packed into one .game.png by the engine (any build of it packs).
  pack:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.P64_REPO }}
          ref: ${{ env.P64_REF }}
          path: p64
      - name: engine build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: p64
          shared-key: p64-linux
      - run: cargo build --release --bin chor --features ws
        working-directory: p64
      - run: p64/target/release/chor pack client game.game.png
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: game.game.png

  # The desktop app (desktop/), which hosts Petrichor64 itself (its engine
  # comes from Cargo.toml, not P64_REF) and fetches the game from the server.
  app-linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo build --release
        working-directory: desktop
        env:
          # what it tells servers it is (desktop/src/net.rs)
          SOSH_VERSION: ${{ needs.version.outputs.name }}
      - name: AppImage
        env:
          VERSION: ${{ needs.version.outputs.name }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p AppDir/usr/bin
          cp desktop/target/release/sosh AppDir/usr/bin/sosh
          cp client/icon.png AppDir/sosh.png
          cat > AppDir/sosh.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=sosh
          Comment=Floating islands to hang out on together
          Exec=sosh
          Icon=sosh
          StartupWMClass=sosh
          Categories=Network;Chat;Game;
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          here="$(dirname "$(readlink -f "$0")")"
          exec "$here/usr/bin/sosh" "$@"
          EOF
          chmod +x AppDir/AppRun
          curl -fsSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir "sosh-${VERSION}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: sosh-*.AppImage

  app-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # windowed (no console) by main.rs's windows_subsystem in release builds
      - run: cargo build --release
        working-directory: desktop
        env:
          # what it tells servers it is (desktop/src/net.rs)
          SOSH_VERSION: ${{ needs.version.outputs.name }}
      - shell: bash
        run: cp desktop/target/release/sosh.exe "sosh-${{ needs.version.outputs.name }}-windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: sosh-*.exe

  # A universal Sosh.app in a dmg, ad-hoc signed and not notarized, as the
  # world's below.
  app-macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: both architectures
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          SOSH_VERSION: ${{ needs.version.outputs.name }}
        working-directory: desktop
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$t"
          done
          lipo -create -output ../sosh target/aarch64-apple-darwin/release/sosh target/x86_64-apple-darwin/release/sosh
          lipo -info ../sosh
      - name: Sosh.app
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          app=Sosh.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          mv sosh "$app/MacOS/sosh"
          mkdir sosh.iconset
          for n in 16 32 128 256 512; do
            sips -z $n $n client/icon.png --out "sosh.iconset/icon_${n}x${n}.png" >/dev/null
            sips -z $((n*2)) $((n*2)) client/icon.png --out "sosh.iconset/icon_${n}x${n}@2x.png" >/dev/null
          done
          iconutil -c icns sosh.iconset -o "$app/Resources/sosh.icns"
          short="${VERSION%%-*}"
          cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>sosh</string>
            <key>CFBundleDisplayName</key><string>sosh</string>
            <key>CFBundleIdentifier</key><string>app.sosh</string>
            <key>CFBundleExecutable</key><string>sosh</string>
            <key>CFBundleIconFile</key><string>sosh</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${short}</string>
            <key>CFBundleVersion</key><string>${short}</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.social-networking</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>For talking in the world.</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Info.plist"
          codesign --force --deep --sign - Sosh.app
          codesign --verify --deep --strict --verbose=2 Sosh.app
      - name: dmg
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          mkdir dmg
          cp -R Sosh.app dmg/
          ln -s /Applications dmg/Applications
          cat > "dmg/Opening sosh.txt" <<'EOF'
          sosh isn't signed by an Apple developer, so macOS stops it the first time.

          1. Drag Sosh into Applications.
          2. Open it. macOS says it can't check it: click Done (or Cancel).
          3. Open System Settings > Privacy & Security, scroll down to
             "Sosh was blocked", and click Open Anyway.
          (Before macOS 15 you can instead right-click Sosh, choose Open, then Open.)

          Or, in Terminal: xattr -dr com.apple.quarantine /Applications/Sosh.app
          EOF
          hdiutil create -volname sosh -srcfolder dmg -ov -format UDZO "sosh-${VERSION}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: sosh-*.dmg

  linux:
    needs: [version, pack]
    # the oldest supported runner, for the oldest glibc the AppImage needs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.P64_REPO }}
          ref: ${{ env.P64_REF }}
          path: p64
      - uses: actions/download-artifact@v4
        with:
          name: game
      - name: engine build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: p64
          shared-key: p64-linux
      - name: engine with the game baked in
        run: |
          cp game.game.png p64/auto.game.png
          cd p64 && cargo build --release --bin chor --features ws,include_auto
      - name: AppImage
        env:
          VERSION: ${{ needs.version.outputs.name }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p AppDir/usr/bin
          cp p64/target/release/chor AppDir/usr/bin/sosh
          cp client/icon.png AppDir/sosh.png
          cat > AppDir/sosh.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=sosh world
          Comment=Floating islands to hang out on together
          Exec=sosh
          Icon=sosh
          Categories=Game;
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          here="$(dirname "$(readlink -f "$0")")"
          exec "$here/usr/bin/sosh" "$@"
          EOF
          chmod +x AppDir/AppRun
          curl -fsSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir "sosh-world-${VERSION}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: sosh-*.AppImage

  windows:
    needs: [version, pack]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.P64_REPO }}
          ref: ${{ env.P64_REF }}
          path: p64
      - uses: actions/download-artifact@v4
        with:
          name: game
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: p64
      - name: engine with the game baked in
        shell: bash
        # A windowed app, with no console window behind the game: link flags
        # for the final binary only (cargo rustc), not build scripts or proc
        # macros as RUSTFLAGS would.
        run: |
          cp game.game.png p64/auto.game.png
          cd p64 && cargo rustc --release --bin chor --features ws,include_auto -- \
            -C link-arg=/SUBSYSTEM:WINDOWS -C link-arg=/ENTRY:mainCRTStartup
      - shell: bash
        run: cp p64/target/release/chor.exe "sosh-world-${{ needs.version.outputs.name }}-windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: sosh-*.exe

  # A universal (Apple Silicon and Intel) "Sosh World.app" in a dmg. There's no
  # Apple Developer ID, so it's ad-hoc signed (an arm64 Mac won't run it
  # unsigned at all) and not notarized: Gatekeeper stops the first launch,
  # and the release notes say how to get past it. With a Developer ID this is
  # where `codesign --options runtime -s "Developer ID Application: …"` and
  # `xcrun notarytool submit --wait` + `xcrun stapler staple` would go.
  macos:
    needs: [version, pack]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.P64_REPO }}
          ref: ${{ env.P64_REF }}
          path: p64
      - uses: actions/download-artifact@v4
        with:
          name: game
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: p64
      - name: engine with the game baked in, for both architectures
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cp game.game.png p64/auto.game.png
          cd p64
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --bin chor --features ws,include_auto --target "$t"
          done
          lipo -create -output ../sosh \
            target/aarch64-apple-darwin/release/chor target/x86_64-apple-darwin/release/chor
          lipo -info ../sosh
      - name: Sosh.app
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          app="Sosh World.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          mv sosh "$app/MacOS/sosh"
          # the icon: client/icon.png at every size an icns wants
          mkdir sosh.iconset
          for n in 16 32 128 256 512; do
            sips -z $n $n client/icon.png --out "sosh.iconset/icon_${n}x${n}.png" >/dev/null
            sips -z $((n*2)) $((n*2)) client/icon.png --out "sosh.iconset/icon_${n}x${n}@2x.png" >/dev/null
          done
          iconutil -c icns sosh.iconset -o "$app/Resources/sosh.icns"
          # CFBundleVersion has to be numbers and dots: 0.1.0-rc1 -> 0.1.0
          short="${VERSION%%-*}"
          cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>sosh world</string>
            <key>CFBundleDisplayName</key><string>sosh world</string>
            <key>CFBundleIdentifier</key><string>app.sosh.world</string>
            <key>CFBundleExecutable</key><string>sosh</string>
            <key>CFBundleIconFile</key><string>sosh</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${short}</string>
            <key>CFBundleVersion</key><string>${short}</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.games</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Info.plist"
          codesign --force --deep --sign - "Sosh World.app"
          codesign --verify --deep --strict --verbose=2 "Sosh World.app"
      - name: dmg
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          mkdir dmg
          cp -R "Sosh World.app" dmg/
          ln -s /Applications dmg/Applications
          cat > "dmg/Opening sosh.txt" <<'EOF'
          sosh world isn't signed by an Apple developer, so macOS stops it the first time.

          1. Drag Sosh World into Applications.
          2. Open it. macOS says it can't check it: click Done (or Cancel).
          3. Open System Settings > Privacy & Security, scroll down to
             "Sosh World was blocked", and click Open Anyway.
          (Before macOS 15 you can instead right-click Sosh World, choose Open, then Open.)

          Or, in Terminal: xattr -dr com.apple.quarantine "/Applications/Sosh World.app"
          EOF
          hdiutil create -volname "sosh world" -srcfolder dmg -ov -format UDZO "sosh-world-${VERSION}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: sosh-*.dmg

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # the SDK has no 'tools' package any more (the action's default asks for it)
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SOSH_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key"
          fi
      - name: build
        env:
          SOSH_VERSION_NAME: ${{ needs.version.outputs.name }}
          SOSH_VERSION_CODE: ${{ github.run_number }}
          SOSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SOSH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SOSH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../sosh-${SOSH_VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: sosh-*.apk

  # The server image, one platform per native runner (no emulation). Pushed
  # by digest only; server-image puts the tags on both.
  server:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # registry names are lowercase; the owner (Auxnon) isn't
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          # what sosh-deploy status shows
          labels: org.opencontainers.image.version=${{ needs.version.outputs.name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.ref_type == 'tag' }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,scope=server-${{ matrix.arch }},mode=max

      # The same image as a file for the release (from the build cache, so
      # quick): podman load names it ghcr.io/<owner>/sosh:<version>.
      - name: image file
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.version=${{ needs.version.outputs.name }}
          outputs: type=docker,name=${{ env.IMAGE }}:${{ needs.version.outputs.name }},dest=sosh-server-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=server-${{ matrix.arch }}
      - run: gzip -6 sosh-server-${{ matrix.arch }}.tar

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: sosh-server-*.tar.gz
          compression-level: 0

      - if: github.ref_type == 'tag'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          d='${{ steps.build.outputs.digest }}'; touch "$RUNNER_TEMP/digests/${d#sha256:}"
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  # Both platforms under one set of tags on ghcr.io.
  server-image:
    if: github.ref_type == 'tag'
    needs: server
    runs-on: ubuntu-latest
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest comes with a release (flavor latest=auto: not for a pre-release)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tag both platforms as one image
        working-directory: ${{ runner.temp }}/digests
        # word splitting wanted: one -t per tag, one argument per digest
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$(jq -r '.tags[0] | split(":")[1]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"

  release:
    if: github.ref_type == 'tag'
    needs: [app-linux, app-windows, app-macos, linux, windows, macos, android, server, server-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            **Desktop:** `sosh-<version>-…`, the app: chat, servers, friends and the world. Windows `.exe`, Linux `.AppImage` (`chmod +x` it first), macOS `.dmg` (Apple Silicon and Intel).
            **The world alone:** `sosh-world-<version>-…`, the game by itself, for the same three.
            **Android:** the `.apk`. Or play in the browser at https://sosh.makeavoy.com.
            **Server:** `ghcr.io/auxnon/sosh:<version>`, or `sosh-server-amd64.tar.gz` / `-arm64` to `podman load`. On the server: `sosh-deploy release <version>` (deploy/README.md).

            The macOS and Windows builds aren't signed by a paid developer account, so the first launch gets a warning:
            - **macOS:** open Sosh (or Sosh World) once, then System Settings > Privacy & Security > Open Anyway (before macOS 15: right-click > Open). The dmg has the steps.
            - **Windows:** SmartScreen's "Windows protected your PC": More info > Run anyway.
